<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="theme-color" content="#f1f5f9">
    <meta name="description" content="Genuine Product Verification">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
    <title>Genuine Product</title>
    <style>
        /* ===== RESET ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

        /* ===== PAGE ===== */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            /* Light gray page background — same as reference */
            background: #eef2f7;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(20px, env(safe-area-inset-top)) 16px
                     max(20px, env(safe-area-inset-bottom));
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== CARD — white, clean, matches reference ===== */
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.09);
            width: 100%;
            max-width: 360px;
            padding: 24px 20px 28px;
            text-align: center;
            /* Subtle entrance */
            animation: popIn .5s cubic-bezier(.16,1,.3,1) both;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(14px) scale(.97); }
            to   { opacity: 1; transform: translateY(0)    scale(1); }
        }

        /* ===== TITLE — matches "This [Name] Is A Genuine Product" ===== */
        .product-title {
            font-size: clamp(1.1rem, 5vw, 1.3rem);
            font-weight: 900;
            color: #0f172a;
            line-height: 1.3;
            margin-bottom: 20px;
            /* reference image: left-aligned, bold */
            text-align: left;
        }

        /* ===== IMAGE CONTAINER — product + shield badge ===== */
        .img-container {
            position: relative;
            display: inline-block;
            width: 100%;
            margin-bottom: 4px;
        }

        .product-img {
            width: 100%;
            /* Square-ish aspect like reference image */
            aspect-ratio: 1 / 1;
            object-fit: contain;
            display: block;
            /* very subtle bg so transparent PNGs look clean */
            background: #f8fafc;
            border-radius: 10px;
        }

        /* ===== SHIELD BADGE — exact position: bottom-right of image ===== */
        .shield-badge {
            position: absolute;
            /* Sits at bottom-right, slightly overlapping down */
            bottom: -10px;
            right: 0px;
            width: clamp(80px, 28%, 110px);
            /* Animate in after image loads */
            opacity: 0;
            transform: scale(.6) rotate(-8deg);
            transition: opacity .45s ease .3s, transform .45s cubic-bezier(.16,1,.3,1) .3s;
        }
        .shield-badge.visible {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        /* ===== SVG SHIELD ===== */
        .shield-svg { width: 100%; height: auto; overflow: visible; }
        .shield-body { fill: #22c55e; filter: drop-shadow(0 4px 10px rgba(34,197,94,.4)); }
        .shield-tick {
            fill: none; stroke: #fff; stroke-width: 7;
            stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 55; stroke-dashoffset: 55;
        }
        .shield-tick.draw {
            animation: drawTick .5s cubic-bezier(.65,0,.45,1) .65s forwards;
        }
        @keyframes drawTick { to { stroke-dashoffset: 0; } }

        /* ===== ERROR STATE ===== */
        .error-state {
            padding: 32px 0;
        }
        .error-icon { font-size: 3rem; margin-bottom: 12px; }
        .error-title { font-size: 1.1rem; font-weight: 800; color: #ef4444; margin-bottom: 8px; }
        .error-msg   { font-size: .88rem; color: #64748b; line-height: 1.6; }
        .error-id    { font-family: monospace; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }

        /* ===== LOADING STATE ===== */
        .loading-state { padding: 48px 0; color: #94a3b8; font-size: .95rem; font-weight: 600; }
        .spinner {
            width: 36px; height: 36px; border: 3px solid #e2e8f0;
            border-top-color: #22c55e; border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== LANDSCAPE + TINY SCREENS ===== */
        @media (max-width: 360px) {
            .card { padding: 18px 14px 22px; }
            .product-title { font-size: 1rem; }
        }
        @media (max-height: 500px) and (orientation: landscape) {
            .card { max-width: 500px; padding: 14px 20px; }
            .product-title { font-size: .95rem; margin-bottom: 10px; }
            .product-img { aspect-ratio: 4/3; }
        }

        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; }
            .shield-badge { transition: none; }
            .shield-tick  { animation: none; stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>

<div class="card" id="card">
    <!-- Loading state shown while fetching products.json -->
    <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        Verifying product…
    </div>
</div>

<script>
(function () {

    // ── 1. Read ?id= from URL ──────────────────────────────────────────────
    const params    = new URLSearchParams(window.location.search);
    const productId = (params.get('id') || '').trim().toUpperCase();

    // ── 2. Fetch products list ─────────────────────────────────────────────
    fetch('products.json')
        .then(r => r.json())
        .then(products => {
            const product = products.find(
                p => p.id.toUpperCase() === productId
            );
            product ? renderProduct(product) : renderError(productId);
        })
        .catch(() => renderError(productId, true));

    // ── 3. Render: matched product ─────────────────────────────────────────
    function renderProduct(p) {
        const card = document.getElementById('card');

        card.innerHTML = `
            <!-- Title: "This [Name] Is A Genuine Product" -->
            <h1 class="product-title">This ${escHtml(p.name)} Is A Genuine Product</h1>

            <!-- Product image with shield badge overlaid bottom-right -->
            <div class="img-container">
                <img
                    class="product-img"
                    src="${escHtml(p.image)}"
                    alt="${escHtml(p.name)}"
                    id="prodImg"
                    decoding="async"
                >

                <!-- Shield with animated checkmark -->
                <div class="shield-badge" id="shieldBadge" aria-hidden="true">
                    <svg class="shield-svg" viewBox="0 0 100 115" xmlns="http://www.w3.org/2000/svg">
                        <!-- Shield body -->
                        <path class="shield-body"
                              d="M50 5 L90 20 L90 58 Q90 90 50 110 Q10 90 10 58 L10 20 Z"/>
                        <!-- Tick -->
                        <path class="shield-tick" id="tick"
                              d="M32 60 L45 74 L70 42"/>
                    </svg>
                </div>
            </div>
        `;

        // Show shield badge + draw tick after image has loaded
        const img   = document.getElementById('prodImg');
        const badge = document.getElementById('shieldBadge');
        const tick  = document.getElementById('tick');

        function showBadge() {
            badge.classList.add('visible');
            tick.classList.add('draw');
        }

        if (img.complete) {
            // Image already cached
            setTimeout(showBadge, 80);
        } else {
            img.addEventListener('load',  showBadge);
            img.addEventListener('error', showBadge); // show badge even if img fails
        }
    }

    // ── 4. Render: product not found ───────────────────────────────────────
    function renderError(id, networkErr) {
        const card = document.getElementById('card');
        const msg  = networkErr
            ? 'Could not load product data. Please check your connection and try again.'
            : id
                ? `No product found with ID <span class="error-id">${escHtml(id)}</span>. Please check the QR code or contact the store.`
                : 'No product ID provided. Please scan the QR code on your product.';

        card.innerHTML = `
            <div class="error-state">
                <div class="error-icon">⚠️</div>
                <p class="error-title">Product Not Found</p>
                <p class="error-msg">${msg}</p>
            </div>
        `;
    }

    // ── Helper: escape HTML to prevent XSS ────────────────────────────────
    function escHtml(str) {
        return String(str)
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;');
    }

})();
</script>

</body>
</html>
